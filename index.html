/* Estado de acordeões e foco preservados entre re-renderizações */
const ABERTOS = {};
document.addEventListener('toggle', (e) => { const d = e.target; if (d.tagName === 'DETAILS' && d.dataset.chave) ABERTOS[d.dataset.chave] = d.open; }, true);
const aberto = (chave, padrao) => ((ABERTOS[chave] ?? padrao) ? 'open' : '');
function rerenderComFoco(foco) { rerender(); if (foco) { const el = document.querySelector(`[data-foco="${CSS.escape(foco)}"]`); if (el) el.focus({ preventScroll: true }); } }
const filtros = { consultas: 'proximas', cresc: 'peso', vac: 'todas', docs: 'todos' };

/* ---------- Consultas ---------- */
function listaConsultas(ids, base) {
  const agora = new Date();
  let cs = Estado.base.consultas.filter((c) => ids.includes(c.pacienteId));
  const f = filtros.consultas;
  if (f === 'proximas') cs = cs.filter((c) => lerData(c.inicio) >= agora && c.status !== 'cancelada' && c.status !== 'concluida' || c.status === 'solicitada' || c.status === 'alteracao').sort((a, b) => lerData(a.inicio) - lerData(b.inicio));
  else if (f === 'realizadas') cs = cs.filter((c) => c.status === 'concluida' || c.status === 'faltou').sort((a, b) => lerData(b.inicio) - lerData(a.inicio));
  else cs = cs.sort((a, b) => lerData(b.inicio) - lerData(a.inicio));

function anel(feitas, total) {
  const r = 48, c = 2 * Math.PI * r, p = total ? feitas / total : 0;
  return `<div class="anel" role="img" aria-label="${feitas} de ${total} doses registradas"><svg viewBox="0 0 112 112" width="112" height="112"><circle cx="56" cy="56" r="${r}" fill="none" stroke="var(--creme-2)" stroke-width="9"/><circle cx="56" cy="56" r="${r}" fill="none" stroke="var(--marrom)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(c * p).toFixed(1)} ${c.toFixed(1)}"/></svg><div class="meio"><span><b class="num">${feitas}</b>de ${total}</span></div></div>`;
}
const ESTADO_DOSE = { feita: ['selo--ok', 'check', 'Registrada'], atrasada: ['selo--alerta', 'alerta', 'Sem registro — idade já passou'], agora: ['selo--suave', 'relogio', 'Idade de agora'], futura: ['selo--tracejado', 'calendario', 'Próxima'], opcional: ['selo--tracejado', 'info', 'Opcional — rede particular'] };
function telaVacinas(c) {
  const vs = vacinasDaCrianca(c.id); const idM = idade(c.nasc).fracMeses;
  const contaveis = vs.filter((v) => !v.soParticular && v.m <= idM + 0.5);
  const feitas = contaveis.filter((v) => v.estado === 'feita').length;
  const pend = vs.filter((v) => v.estado === 'atrasada' || v.estado === 'agora').length;
  const f = filtros.vac;
  const filtrar = (v) => f === 'todas' || (f === 'pendentes' && (v.estado === 'atrasada' || v.estado === 'agora')) || (f === 'registradas' && v.estado === 'feita') || (f === 'particular' && v.soParticular);

function eventosLinha(ids) {
  const ev = [];
  ids.forEach((id) => {
    const c = Estado.paciente(id); const n = primeiroNome(c.nome);
    ev.push({ data: c.nasc, icone: 'bebe', titulo: `Nascimento de ${n}`, texto: fmtDataLonga(c.nasc, true) });
    Estado.consultasDe(id).filter((x) => x.status === 'concluida').forEach((x) => ev.push({ data: x.inicio, icone: 'estetoscopio', titulo: `${x.tipo} · ${n}`, texto: x.motivo }));
    const porData = {};
    Object.entries(Estado.base.vacinas[id] || {}).forEach(([k, r]) => { const v = VACINAS.find((x) => x.p === k || x.x === k); const nome = v ? v.vacina.split(' (')[0] : k.startsWith('gripe-') ? 'Gripe ' + k.slice(6) : k; (porData[r.data] = porData[r.data] || []).push(nome); });
    Object.entries(porData).forEach(([d, l]) => ev.push({ data: d, icone: 'vacina', titulo: `Vacinas · ${n}`, texto: [...new Set(l)].join(', ') }));
    Estado.medidasDe(id).forEach((m) => ev.push({ data: m.data, icone: 'crescimento', titulo: `Medição · ${n}`, texto: [m.peso && `${String(m.peso).replace('.', ',')} kg`, m.altura && `${String(m.altura).replace('.', ',')} cm`].filter(Boolean).join(' · ') + (m.origem === 'familia' ? ' (registrada pela família)' : '') }));
    const mporData = {};
    Object.entries(Estado.base.marcos[id] || {}).forEach(([k, d]) => (mporData[d] = (mporData[d] || 0) + 1));
    Object.entries(mporData).forEach(([d, q]) => ev.push({ data: d, icone: 'marcos', titulo: `Marcos · ${n}`, texto: `${plural(q, 'marco marcado', 'marcos marcados')}` }));
    P.dados.diario.filter((d) => d.criancaId === id).forEach((d) => ev.push({ data: d.data, icone: 'diario', titulo: `${d.categoria} · ${n}`, texto: d.texto }));
  });
  return ev.filter((e) => lerData(e.data) <= new Date()).sort((a, b) => lerData(b.data) - lerData(a.data));
}
function telaLinhaTempo(ids) {

}

  else if (/(documento|receita|exame|declarac)/.test(n)) { links.push({ titulo: 'Documentos e exames', href: '#/documentos', icone: 'documentos' }); intro = 'Receitas, solicitações de exames, declarações e documentos da consulta ficam reunidos aqui:'; }
  else if (/(consulta|agend|marcar)/.test(n)) { links.push({ titulo: 'Consultas', href: '#/consultas', icone: 'consulta' }); intro = 'Você pode ver as consultas e registrar uma solicitação:'; }
  const achados = buscar(t, 6).filter((r) => r.tipo !== 'Seção do app' || !links.length).slice(0, links.length ? 3 : 5);

function ligarFormRemedio(m, pre) {
  const f = m.el.querySelector('#f-rem');

  f.querySelectorAll('[data-modo]').forEach((b) => (b.onclick = () => aplicarModo(b.dataset.modo)));
  aplicarModo(pre.modo || 'dias');
  m.el.querySelector('#rm-ok').onclick = () => {
    const modo = f.querySelector('input[name=modo]:checked').value;
    const inteiro = (min, max, rot) => (v) => (!/^\d+$/.test(String(v).trim()) || +v < min || +v > max ? `Informe ${rot} entre ${min} e ${max}.` : '');
    const regras = { nome: obrig('o nome do remédio'), dose: obrig('a dose escrita na receita'), intervalo: (v) => (v ? '' : 'Selecione o intervalo da receita.'), inicio: (v) => (!v ? 'Informe o horário da primeira dose.' : lerData(v) < somarDias(new Date(), -30) ? 'Use um horário dos últimos 30 dias.' : '') };
    if (modo !== 'continuo') regras.dias = inteiro(1, 180, 'os dias');
    if (modo === 'repetir') { regras.repetirApos = inteiro(1, 120, 'a pausa em dias'); regras.repetirDias = inteiro(1, 60, 'os dias da repetição'); regras.repeticoes = inteiro(1, 6, 'o número de repetições'); }
    if (!validar(f, regras)) return;
    const ini = isoLocal(lerData(f.inicio.value));
    P.dados.meds.push({ id: uid('rm'), criancaId: f.crianca.value, nome: f.nome.value.trim(), dose: f.dose.value.trim(), intervalo: +f.intervalo.value, dias: modo === 'continuo' ? 0 : +f.dias.value, continuo: modo === 'continuo',
      repetirApos: modo === 'repetir' ? +f.repetirApos.value : 0, repetirDias: modo === 'repetir' ? +f.repetirDias.value : 0, repeticoes: modo === 'repetir' ? +f.repeticoes.value : 0,
      inicio: ini, etapas: [{ inicio: ini, dias: modo === 'continuo' ? 0 : +f.dias.value, tomadas: [] }], etapaAtual: 0, encerradoEm: null, origem: pre.simulado ? 'leitura-simulada' : 'manual' });

  };
}

const filtroAl = { f: 'todos' };
let alSugDesloc = 0;
function alimentosCatalogo(cid) {
  const base = (Estado.conteudo.alimentos || ALIMENTOS_PADRAO).filter((a) => !a.oculto);
  const extras = (PD('alimentosExtras', {})[cid] || []).map((e) => ({ ...e, extra: true }));
  return [...base, ...extras];
}
function regAlimentos(cid) { const t = PD('alimentacao', {}); return (t[cid] = t[cid] || {}); }
function estadoAlimento(cid, a) {
  const r = regAlimentos(cid)[a.id]; if (!r || !r.ofertas || !r.ofertas.length) return null;
  const of = [...r.ofertas].sort((x, y) => (x.data < y.data ? -1 : 1)); const ult = of[of.length - 1];
  return { vezes: of.length, primeira: of[0].data, ultima: ult.data, aceitacao: ult.aceitacao, reacaoAlguma: of.some((o) => o.aceitacao === 'reacao'), ofertas: of };
}
const aceit = (id) => ACEITACAO.find((x) => x.id === id) || ACEITACAO[2];
function sugestoesAlimentos(cid, est) {
  const porGrupo = ALIMENTOS_GRUPOS.map((g) => {
    const itens = est.filter((x) => x.a.grupo === g.id);
    return { g, provados: itens.filter((x) => x.e).length, faltam: itens.filter((x) => !x.e).map((x) => x.a) };
  }).filter((x) => x.faltam.length).sort((a, b) => a.provados - b.provados);
  const dia = Math.floor(Date.now() / 864e5) + alSugDesloc;
  const sug = [];
  for (let volta = 0; sug.length < 6 && volta < 3; volta++) porGrupo.forEach((x) => { if (sug.length < 6 && x.faltam.length > volta) sug.push(x.faltam[(dia + volta) % x.faltam.length]); });
  return [...new Map(sug.map((a) => [a.id, a])).values()];
}
function telaAlimentacao(c) {
  const cat = alimentosCatalogo(c.id);
  const est = cat.map((a) => ({ a, e: estadoAlimento(c.id, a) }));
  const provados = est.filter((x) => x.e);
  const conta = Object.fromEntries(ACEITACAO.map((x) => [x.id, provados.filter((p) => p.e.aceitacao === x.id).length]));
  const comReacao = provados.filter((p) => p.e.reacaoAlguma);
  const sug = sugestoesAlimentos(c.id, est);
  const f = filtroAl.f;
  const passa = (x) => f === 'todos' || (f === 'provados' && x.e) || (f === 'faltam' && !x.e) || (x.e && x.e.aceitacao === f);
  const nome1 = esc(primeiroNome(c.nome));
  return `
  <section class="cartao al-resumo">
    <div class="al-total"><b class="num">${provados.length}</b><span>de ${cat.length}<br>alimentos da lista</span></div>

function albumDe(cid) { const a = PD('album', {}); return (a[cid] = a[cid] || []).sort((x, y) => x.meses - y.meses || (x.data < y.data ? -1 : 1)); }

function comprimirImagem(arq, max = 720, q = 0.72) {
  return new Promise((ok, erro) => {
    const r = new FileReader();
    r.onerror = () => erro(new Error('leitura'));
    r.onload = () => { const img = new Image(); img.onerror = () => erro(new Error('imagem')); img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)); const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); ok(cv.toDataURL('image/jpeg', q));
    }; img.src = r.result; };
    r.readAsDataURL(arq);
  });
}

/* =====================================================================

   ===================================================================== */
function dadosRetro(c) {
  const consultas = Estado.consultasDe(c.id).filter((x) => x.status === 'concluida');
  const vac = vacinasDaCrianca(c.id).filter((v) => v.registro).length + Object.keys(Estado.base.vacinas[c.id] || {}).filter((k) => k.startsWith('gripe-')).length;
  const regM = Estado.base.marcos[c.id] || {};
  const marcos = MARCOS.flatMap((f) => f.itens.filter((i) => regM[i.id]).map((i) => ({ ...i, fase: f.rotulo, data: regM[i.id] }))).sort((a, b) => (a.data < b.data ? 1 : -1));
  const alim = alimentosCatalogo(c.id).map((a) => ({ a, e: estadoAlimento(c.id, a) })).filter((x) => x.e);
  const conquistas = P.dados.diario.filter((d) => d.criancaId === c.id && d.categoria === 'Conquista').sort((a, b) => lerData(b.data) - lerData(a.data));
  const ms = Estado.medidasDe(c.id);
  return { consultas, vac, marcos, alim, conquistas, ms, fotos: albumDe(c.id) };
}

  const c = criancaOuPrimeira(id); if (!c) return semCrianca();
  const D = dadosRetro(c); const m0 = D.ms[0], m1 = D.ms[D.ms.length - 1];
  const tiles = [['consulta', 'Consultas realizadas', D.consultas.length], ['vacina', 'Doses registradas', D.vac], ['marcos', 'Marcos alcançados', D.marcos.length], ['maca', 'Alimentos experimentados', D.alim.length], ['estrela', 'Conquistas no diário', D.conquistas.length], ['imagem', 'Fotos no álbum', D.fotos.length]];
  return `
  <div class="acoes" style="justify-content:space-between;margin-bottom:14px">${seletorCriancas(c.id, 'retrospectiva/{id}') || '<span></span>'}
    <div class="acoes"><button type="button" class="btn btn--sec btn--peq" data-acao="retro-compartilhar" data-crianca="${c.id}">${ic('compartilhar')}Compartilhar com a família</button><button type="button" class="btn btn--sec btn--peq" data-acao="retro-imprimir" data-crianca="${c.id}">${ic('imprimir')}Imprimir ou salvar PDF</button></div></div>
  <header class="crianca-cab padrao">${inicial(c.nome, true)}<div><h1>${esc(c.nome)}</h1><div class="dados"><span>${idadeTexto(c.nasc)}</span><span>Desde ${fmtData(c.nasc)}</span></div></div></header>
  <div class="resumo-grade secao">${tiles.map(([i, t, n]) => `<div class="cartao resumo-cartao"><div class="rotulo-c">${ic(i, 'ic--s')}${t}</div><div class="valor num">${n}</div></div>`).join('')}</div>
  ${m0 && m1 && m0 !== m1 ? `<section class="cartao secao"><h2 class="t-3">Crescimento registrado</h2><p style="margin:6px 0 0">De ${numBR(m0.peso)} kg e ${numBR(m0.altura)} cm (${fmtData(m0.data)}) para ${numBR(m1.peso)} kg e ${numBR(m1.altura)} cm (${fmtData(m1.data)}).</p><a class="peq" href="#/crianca/${c.id}/crescimento">Ver gráficos</a></section>` : ''}
  <div class="grade grade-2 secao">
    <section class="cartao"><h2 class="t-3" style="margin-bottom:10px">Conquistas</h2>${D.marcos.length || D.conquistas.length ? `<ul class="lista">${[...D.conquistas.slice(0, 4).map((d) => `<li class="linha">${ic('estrela')}<div class="linha-corpo"><b style="font-weight:400">${esc(d.texto)}</b><small>Diário · ${fmtData(d.data)}</small></div></li>`), ...D.marcos.slice(0, 6).map((mm) => `<li class="linha">${ic('marcos')}<div class="linha-corpo"><b style="font-weight:400">${esc(mm.t)}</b><small>${esc(mm.fase)} · marcado em ${fmtData(mm.data)}</small></div></li>`)].join('')}</ul>` : '<p class="mudo peq" style="margin:0">Marque os marcos e registre conquistas no diário para vê-los aqui.</p>'}</section>
    <section class="cartao"><h2 class="t-3" style="margin-bottom:10px">Alimentos preferidos</h2>${D.alim.filter((x) => x.e.aceitacao === 'adorou').length ? `<div class="chips">${D.alim.filter((x) => x.e.aceitacao === 'adorou').map((x) => `<span class="chip">${ic('rostoMuitoFeliz', 'ic--s')}${esc(x.a.nome)}</span>`).join('')}</div>` : `<p class="mudo peq" style="margin:0">Quando você marcar “adorou” na introdução alimentar, o alimento aparece aqui.</p>`}<a class="peq" href="#/crianca/${c.id}/alimentacao" style="display:inline-block;margin-top:10px">Abrir a introdução alimentar</a></section>
  </div>
  ${D.fotos.length ? `<section class="secao">${cabecalhoSecao('Fotos', `<a class="peq" href="#/crianca/${c.id}/album">Abrir o álbum</a>`)}<div class="album-tira">${D.fotos.slice(-8).map((f) => `<figure><img src="${f.foto}" alt="${esc(rotuloMesVida(f.meses))}" loading="lazy"><figcaption class="mini">${esc(rotuloMesVida(f.meses))}</figcaption></figure>`).join('')}</div></section>` : ''}`;
});
function textoRetro(c) {
  const D = dadosRetro(c);
  return `${c.nome} — ${idadeTexto(c.nasc)}\n\nConsultas realizadas: ${D.consultas.length}\nDoses de vacina registradas: ${D.vac}\nMarcos alcançados: ${D.marcos.length}\nAlimentos experimentados: ${D.alim.length}${D.alim.filter((x) => x.e.aceitacao === 'adorou').length ? `\nPreferidos: ${D.alim.filter((x) => x.e.aceitacao === 'adorou').map((x) => x.a.nome).join(', ')}` : ''}${D.conquistas.length ? `\n\nConquistas:\n${D.conquistas.slice(0, 5).map((d) => '• ' + d.texto).join('\n')}` : ''}`;
}
ACOES['retro-compartilhar'] = (el) => { const c = Estado.paciente(el.dataset.crianca); compartilhar({ titulo: `Retrospectiva de ${primeiroNome(c.nome)}`, texto: textoRetro(c) }); };
ACOES['retro-imprimir'] = (el) => { const c = Estado.paciente(el.dataset.crianca); imprimirHTML(`Retrospectiva — ${c.nome}`, `${logo('lockup_v')}<h2 style="margin-top:18px">Retrospectiva</h2><pre style="white-space:pre-wrap;font:inherit">${esc(textoRetro(c))}</pre><div style="display:flex;flex-wrap:wrap;gap:8px">${albumDe(c.id).slice(-6).map((f) => `<figure style="margin:0;width:150px"><img src="${f.foto}" style="width:150px;height:150px;object-fit:cover;border-radius:10px" alt=""><figcaption class="mini">${esc(rotuloMesVida(f.meses))}</figcaption></figure>`).join('')}</div>`); };

/* =====================================================================
   EMERGÊNCIA E PRIMEIROS SOCORROS
   ===================================================================== */
rota('emergencia', 'Emergência', () => {
  const cl = Estado.clinica; const tel = cl.confirmados.telefone && cl.telefone;
  const soc = ORIENTACOES.filter((o) => o.cat === 'socorros' && Estado.conteudo.orientacoes[o.id]?.publicado !== false);
  return `
  <section class="cartao cartao--escuro emergencia-cab"><span class="ic-redondo">${ic('alerta')}</span><div><h2 class="t-2">Em uma emergência, ligue primeiro</h2><p style="margin:4px 0 0;opacity:.9">Não espere uma resposta pelo app nem procure conteúdo antes de pedir ajuda.</p></div></section>
  <div class="grade grade-2 secao">
    <a class="cartao emergencia-num" href="tel:192"><span class="num">192</span><div><b>SAMU</b><small>Atendimento médico de urgência</small></div>${ic('telefone')}</a>
    <a class="cartao emergencia-num" href="tel:193"><span class="num">193</span><div><b>Corpo de Bombeiros</b><small>Resgate, afogamento, incêndio</small></div>${ic('telefone')}</a>
    ${tel ? `<a class="cartao emergencia-num" href="tel:${esc(tel.replace(/[^\d+]/g, ''))}"><span class="num">${ic('estetoscopio')}</span><div><b>Clínica da Dra. Mayze</b><small>${esc(tel)} · para dúvidas que não são emergência</small></div>${ic('telefone')}</a>` : `<a class="cartao emergencia-num" href="#/contato"><span class="num">${ic('estetoscopio')}</span><div><b>Clínica da Dra. Mayze</b><small>Contatos para dúvidas que não são emergência</small></div>${ic('direita')}</a>`}
  </div>
  <section class="secao">${cabecalhoSecao('Primeiros socorros', '<a class="peq" href="#/orientacoes">Todas as orientações</a>')}
    ${soc.length ? `<ul class="lista">${soc.map((o) => { const ed = Estado.conteudo.orientacoes[o.id] || {}; return `<li><a class="linha" href="#/orientacao/${o.id}">${ic('alerta')}<div class="linha-corpo"><b>${esc(o.titulo)}</b><small>${(ed.texto || '').trim() ? (ed.validado ? 'Validado pela Dra. Mayze' : 'Orientação') : esc(TEXTO_PENDENTE)}</small></div>${ic('direita', 'ic-seta')}</a></li>`; }).join('')}</ul>` : '<p class="mudo">Nenhuma orientação publicada.</p>'}
  </section>`;
});

/* =====================================================================
   E-BOOKS DA DRA. MAYZE
   ===================================================================== */
rota('ebooks', 'E-books', () => {
  const eb = (Estado.conteudo.ebooks || []).filter((e) => e.publicado !== false);
  return eb.length ? `<div class="grade grade-2">${eb.map((e) => `<article class="cartao ebook">
      <div class="ebook-capa padrao" aria-hidden="true">${ic('livro')}</div>
      <div class="linha-corpo"><h2 class="t-3">${esc(e.titulo)}</h2><p class="peq mudo" style="margin:4px 0 12px">${esc(e.descricao || '')}</p>
      ${e.link ? `<a class="btn btn--peq" href="${esc(e.link)}" target="_blank" rel="noopener">${ic('externo')}Conhecer o e-book</a>` : `<span class="selo selo--tracejado">${ic('relogio')}Link em breve</span>`}</div></article>`).join('')}</div>`
    : `<div class="vazio"><h3>Nenhum e-book disponível</h3><p>Quando a Dra. Mayze publicar materiais, eles aparecem aqui.</p></div>`;
});

/* =====================================================================
   AVALIAÇÃO DAS CONSULTAS (satisfação)
   ===================================================================== */
function avaliacaoDe(cid) { return (Estado.base.avaliacoes || []).find((a) => a.consultaId === cid); }
function gravarAvaliacao(consulta, nota, comentario) {
  const lista = (Estado.base.avaliacoes = Estado.base.avaliacoes || []);
  let a = avaliacaoDe(consulta.id);
  if (!a) { a = { id: uid('av'), consultaId: consulta.id, pacienteId: consulta.pacienteId, familia: Sessao.familia }; lista.push(a); }
  Object.assign(a, { nota: Number(nota), comentario: comentario ?? a.comentario ?? '', data: isoLocal() });
  Estado.registrarAtividade(`Avaliação de atendimento pelo portal: ${SATISFACAO[a.nota - 1].rotulo.toLowerCase()} (${Estado.paciente(consulta.pacienteId).nome})`, 'portal');
  Estado.salvar('base'); return a;
}
function avaliarConsulta(cid, notaInicial) {
  const c = Estado.base.consultas.find((x) => x.id === cid); if (!c) return;
  const a = avaliacaoDe(cid) || {};
  const m = abrirModal({ titulo: 'Avaliar atendimento', corpo: `<p class="mudo peq" style="margin-top:0">${esc(c.tipo)} de ${esc(primeiroNome(Estado.paciente(c.pacienteId).nome))} · ${fmtDataLonga(c.inicio)}</p>
    <form id="f-avc" class="pilha" novalidate><div class="campo"><span class="rotulo-campo">Como foi o atendimento?</span>${rostos('nota', SATISFACAO, notaInicial ?? a.nota ?? '', 'Satisfação com o atendimento')}<span class="erro-radio" id="avc-erro" hidden>Escolha uma opção.</span></div>
    <div class="campo"><label for="avc-c">Quer contar mais? (opcional)</label><textarea id="avc-c" name="comentario" rows="3" maxlength="600">${esc(a.comentario || '')}</textarea></div></form>
    <p class="mini mudo">A avaliação é vista pela equipe da clínica.</p>`,
    rodape: `<button class="btn btn--sec" data-fechar>Cancelar</button><button class="btn" id="avc-ok">Enviar avaliação</button>` });
  m.el.querySelector('#avc-ok').onclick = () => {
    const sel = m.el.querySelector('input[name="nota"]:checked'); m.el.querySelector('#avc-erro').hidden = !!sel; if (!sel) return;
    gravarAvaliacao(c, sel.value, m.el.querySelector('#avc-c').value.trim()); m.fechar(); rerender(); toast('Obrigado pela avaliação.', { icone: SATISFACAO[sel.value - 1].icone });
  };
}
ACOES['avaliar-consulta'] = (el) => avaliarConsulta(el.dataset.id);
ACOES['avaliar-rapido'] = (el) => {
  const c = Estado.base.consultas.find((x) => x.id === el.dataset.id); if (!c) return;
  gravarAvaliacao(c, el.dataset.nota); rerender();
  toast('Obrigado pela avaliação.', { icone: SATISFACAO[el.dataset.nota - 1].icone, acao: 'Adicionar comentário', aoAcao: () => avaliarConsulta(c.id) });
};
ACOES['avaliacao-dispensar'] = (el) => { PD('avaliacaoDispensada', {})[el.dataset.id] = true; P.salvar(); rerender(); };
function consultaParaAvaliar() {
  const ids = P.criancas().map((c) => c.id); const limite = somarDias(new Date(), -30);
  return Estado.base.consultas.filter((c) => ids.includes(c.pacienteId) && c.status === 'concluida' && lerData(c.inicio) >= limite && !avaliacaoDe(c.id) && !(P.dados.avaliacaoDispensada || {})[c.id]).sort((a, b) => lerData(b.inicio) - lerData(a.inicio))[0] || null;
}

/* =====================================================================
   VACINAS CHEGANDO (próxima faixa do calendário)
   ===================================================================== */
function proximaFaixaVacina(c) {
  const idM = idade(c.nasc).fracMeses; const vs = vacinasDaCrianca(c.id);
  const g = VACINAS_IDADES.find((x) => x.m > idM + 0.5 && vs.some((v) => v.m === x.m && !v.soParticular && v.estado !== 'feita'));
  if (!g) return null;
  const data = somarMeses(c.nasc, g.m); return { g, data: isoDia(data), dias: Math.max(0, diasEntre(new Date(), data)) };
}

/* =====================================================================
   INÍCIO: cartões novos (mesversário, avaliação, vacinas, instalar)
   ===================================================================== */
const _renderInicio = ROTAS.inicio.render;
ROTAS.inicio.render = (...args) => {
  let html = _renderInicio(...args);
  const topo = [];
  mesversarios().forEach(({ c, meses, chave, hoje }) => topo.push(`<section class="cartao cartao--marrom padrao mesversario" style="--padrao-opac:.12" aria-label="Mesversário">
    <div class="acoes" style="justify-content:space-between;flex-wrap:nowrap;align-items:flex-start"><div><span class="peq" style="color:var(--areia-clara)">Mesversário</span><h3 class="t-2" style="margin-top:4px">${esc(primeiroNome(c.nome))} ${hoje ? 'completa hoje' : 'completou'} ${esc(rotuloFase(meses))}</h3></div>
    <button type="button" class="btn-icone" data-acao="mesversario-dispensar" data-chave="${chave}" aria-label="Dispensar aviso do mesversário" style="color:inherit">${ic('fechar')}</button></div>
    <div class="acoes" style="margin-top:12px"><button type="button" class="btn btn--claro btn--peq" data-acao="album-adicionar" data-crianca="${c.id}" data-meses="${meses}">${ic('camera')}Guardar a foto do mês</button><a class="btn btn--sec btn--peq btn--sobre-escuro" href="#/crianca/${c.id}/marcos">Ver marcos da fase</a></div></section>`));
  const av = consultaParaAvaliar();
  if (av) topo.push(`<section class="cartao avaliar-cartao" aria-label="Avaliar atendimento">
    <div class="acoes" style="justify-content:space-between;flex-wrap:nowrap;align-items:flex-start"><div><h3 class="t-3">Como foi a consulta de ${esc(primeiroNome(Estado.paciente(av.pacienteId).nome))}?</h3><p class="peq mudo" style="margin:2px 0 0">${esc(av.tipo)} · ${fmtDataLonga(av.inicio)}</p></div>
    <button type="button" class="btn-icone" data-acao="avaliacao-dispensar" data-id="${av.id}" aria-label="Agora não">${ic('fechar')}</button></div>
    <div class="rostos rostos--rapido" role="group" aria-label="Satisfação com o atendimento">${SATISFACAO.map((s) => `<button type="button" class="rosto-btn" data-acao="avaliar-rapido" data-id="${av.id}" data-nota="${s.nota}" aria-label="${s.rotulo}" title="${s.rotulo}">${ic(s.icone)}<small>${s.rotulo}</small></button>`).join('')}</div></section>`);
  const lateral = [];
  const c = P.ativa();
  if (c) {
    const pend = vacinasDaCrianca(c.id).filter((v) => v.estado === 'atrasada').length; const pf = proximaFaixaVacina(c);
    if (pend || (pf && pf.dias <= 45)) lateral.push(`<a class="cartao" href="#/crianca/${c.id}/vacinas" style="display:block;text-decoration:none;color:inherit"><div class="acoes" style="flex-wrap:nowrap"><span class="ic-redondo">${ic('vacina')}</span><div><h3 class="t-3">Vacinas de ${esc(primeiroNome(c.nome))}</h3><p class="peq mudo" style="margin:2px 0 0">${pend ? `${plural(pend, 'dose de idade anterior sem registro', 'doses de idades anteriores sem registro')}` : ''}${pend && pf && pf.dias <= 45 ? ' · ' : ''}${pf && pf.dias <= 45 ? `próxima faixa (${esc(pf.g.rotulo)}) ${pf.dias === 0 ? 'hoje' : `em ${plural(pf.dias, 'dia', 'dias')}`}` : ''}</p></div></div></a>`);
  }
  const instalado = window.matchMedia && matchMedia('(display-mode: standalone)').matches;
  if (!instalado && !P.dados.instalarDispensado) lateral.push(`<section class="cartao"><div class="acoes" style="flex-wrap:nowrap;align-items:flex-start"><span class="ic-redondo">${ic('instalar')}</span><div class="linha-corpo"><h3 class="t-3">Tenha o app na tela inicial</h3><p class="peq mudo" style="margin:2px 0 8px">Abra o Espaço da Família com um toque.</p><a class="btn btn--sec btn--peq" href="#/instalar">Como instalar</a></div><button type="button" class="btn-icone" data-acao="instalar-dispensar" aria-label="Dispensar sugestão de instalar">${ic('fechar')}</button></div></section>`);
  if (topo.length) html = html.replace('<div class="inicio-grade">', `<div class="pilha" style="margin-bottom:20px">${topo.join('')}</div><div class="inicio-grade">`);
  if (lateral.length) html = html.replace('<aside class="pilha" aria-label="Agora">', `<aside class="pilha" aria-label="Agora">${lateral.join('')}`);
  return html;
};
ACOES['instalar-dispensar'] = () => { P.dados.instalarDispensado = true; P.salvar(); rerender(); };

/* =====================================================================
   TOUR DE BOAS-VINDAS
   ===================================================================== */
const TOUR = [
  ['inicio', 'Tudo começa no início', 'A próxima consulta, os lembretes de remédio, o mesversário e as atualizações da família aparecem aqui.'],
  ['bebe', 'Uma página para cada criança', 'Em Minha família, abra o perfil para ver consultas, crescimento, vacinas, marcos, introdução alimentar e o álbum.'],
  ['guias', 'Conteúdos da Dra. Mayze', 'Guias por fase, orientações gerais, e-books e os vídeos do Pediatra Explica, organizados por assunto.'],
  ['relogio', 'Ferramentas do dia a dia', 'Lembretes de remédio, rotina do bebê (mamadas, fraldas e sono), minhas dúvidas e o diário da família.'],
  ['alerta', 'Em caso de emergência', 'O app não substitui a consulta. Em uma emergência, ligue 192 (SAMU). Os números ficam em Emergência, no menu.']
];
function abrirTour() {
  let i = 0;
  const corpo = () => `<div class="tour"><span class="ic-redondo tour-ic">${ic(TOUR[i][0])}</span><h3 class="t-2">${TOUR[i][1]}</h3><p class="prosa">${TOUR[i][2]}</p><div class="tour-pontos" aria-hidden="true">${TOUR.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div><p class="sr" aria-live="polite">Passo ${i + 1} de ${TOUR.length}</p></div>`;
  const rod = () => `<button class="btn btn--fantasma" data-x="pular">${i === TOUR.length - 1 ? 'Fechar' : 'Pular'}</button>${i ? '<button class="btn btn--sec" data-x="ant">Voltar</button>' : ''}<button class="btn" data-x="prox">${i === TOUR.length - 1 ? 'Começar a usar' : 'Próximo'}</button>`;
  const m = abrirModal({ titulo: 'Conheça o Espaço da Família', corpo: corpo(), rodape: rod(), aoFechar: () => { P.dados.tourVisto = true; P.salvar(); } });
  const pintar = () => { m.el.querySelector('.modal-corpo').innerHTML = corpo(); m.el.querySelector('.modal-rodape').innerHTML = rod(); ligar(); m.el.querySelector('[data-x="prox"]').focus(); };
  const ligar = () => {
    m.el.querySelector('[data-x="pular"]').onclick = () => m.fechar();
    const a = m.el.querySelector('[data-x="ant"]'); if (a) a.onclick = () => { i--; pintar(); };
    m.el.querySelector('[data-x="prox"]').onclick = () => { if (i === TOUR.length - 1) m.fechar(); else { i++; pintar(); } };
  };
  ligar();
}
ACOES.tour = () => abrirTour();
const _concluirBV = ACOES['concluir-boas-vindas'];
ACOES['concluir-boas-vindas'] = (...a) => { _concluirBV(...a); if (!P.dados.tourVisto) setTimeout(abrirTour, 250); };
const _renderSobre = ROTAS.sobre && ROTAS.sobre.render;
if (_renderSobre) ROTAS.sobre.render = (...a) => `${_renderSobre(...a)}<section class="secao"><button type="button" class="btn btn--sec" data-acao="tour">${ic('info')}Rever o tour de boas-vindas</button></section>`;

iniciar();

</script>
</body>
</html>
