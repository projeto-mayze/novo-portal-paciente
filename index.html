/* =====================================================================
   PRONTUÁRIO ELETRÔNICO — módulo dentro do painel da equipe (#/prontuario)
   Escopo próprio: ações, formulários e telas não colidem com o painel.
   ===================================================================== */
const PRONT = (() => {
const ACOES = {}; const FORMS = {}; const ABERTOS = {};
const ativo = () => typeof rotaAtual !== 'undefined' && rotaAtual.nome === 'prontuario' && !!document.getElementById('pr');
document.addEventListener('toggle', (e) => { const d = e.target; if (d.tagName === 'DETAILS' && d.dataset.chave) ABERTOS[d.dataset.chave] = d.open; }, true);
const aberto = (k, p) => ((ABERTOS[k] ?? p) ? 'open' : '');
document.addEventListener('click', (e) => { if (!ativo()) return; const el = e.target.closest('[data-acao]'); if (!el || el.disabled) return; const fn = ACOES[el.dataset.acao]; if (fn) { e.preventDefault(); fn(el, e); } });
document.addEventListener('submit', (e) => { if (!ativo()) return; const f = e.target.closest('[data-form]'); if (!f) return; const fn = FORMS[f.dataset.form]; if (fn) { e.preventDefault(); fn(f, e); } });
function avisoInfo(t, i = 'info') { return `<div class="aviso" role="note">${ic(i)}<span>${t}</span></div>`; }
function cab(t, extra = '') { return `<div class="secao-cab"><h2>${t}</h2>${extra}</div>`; }
const mi = (n) => `<span class="mini-inicial" aria-hidden="true">${esc(primeiroNome(n).charAt(0))}</span>`;
const num = (v) => (v == null || v === '' ? '—' : String(v).replace('.', ','));
const ABAS = [['resumo', 'Resumo', 'painel'], ['evolucoes', 'Evoluções', 'prancheta'], ['crescimento', 'Crescimento', 'crescimento'], ['vacinas', 'Vacinação', 'vacina'], ['prescricoes', 'Prescrições', 'remedio'], ['exames', 'Exames e anexos', 'anexo'], ['antecedentes', 'Antecedentes e alergias', 'alerta']];
let buscaPac = ''; let estado = { pid: null, aba: 'resumo' };
const salvarBase = (txt) => { if (txt) Estado.registrarAtividade(txt, 'prontuario'); Estado.salvar('base'); };

function lerRota() {
  const h = decodeURIComponent(location.hash.replace(/^#\/?/, '')).replace(/^prontuario\/?/, '');
  const [t, pid, aba] = h.split('/');
  return t === 'p' && Estado.paciente(pid) ? { pid, aba: ABAS.some((a) => a[0] === aba) ? aba : 'resumo' } : { pid: null, aba: 'resumo' };
}
function listaPacientesHTML() {
  const q = normalizar(buscaPac);
  const ps = Estado.base.pacientes.filter((p) => !q || normalizar(`${p.nome} ${p.id} ${p.responsavel.nome}`).includes(q)).sort((a, b) => (a.ativo === false) - (b.ativo === false) || a.nome.localeCompare(b.nome));
  return ps.length ? ps.map((p) => `<a class="paciente-item" href="#/prontuario/p/${p.id}/${estado.aba}" ${p.id === estado.pid ? 'aria-current="page"' : ''}>${mi(p.nome)}<span><span style="font-weight:500">${esc(p.nome)}</span><small>${p.id} · ${idadeTexto(p.nasc, null, true)}${p.ativo === false ? ' · inativo' : ''}</small><small>${p.antecedentes.length ? esc(p.antecedentes[0].descricao).slice(0, 40) : 'Sem antecedentes registrados'}</small></span>${p.alergias.length ? `<span class="al" title="${plural(p.alergias.length, 'alergia', 'alergias')}" aria-label="${plural(p.alergias.length, 'alergia registrada', 'alergias registradas')}">${ic('alerta')}</span>` : ''}</a>`).join('') : '<p class="mudo peq">Nenhum paciente encontrado.</p>';
}
function renderizar(manter = false) {
  const r = lerRota(); const mudou = r.pid !== estado.pid || r.aba !== estado.aba; estado = r;
  const p = r.pid ? Estado.paciente(r.pid) : null; const y = window.scrollY;
  const raiz = $('#pr-raiz'); if (!raiz) return;
  if (!$('#pr')) {
    raiz.innerHTML = `<div class="pr" id="pr"><aside class="pr-lista" aria-label="Pacientes"><a class="btn btn--sec btn--peq pr-so-movel" href="#/prontuario" id="pr-voltar" style="margin-bottom:10px">${ic('esquerda')}Lista de pacientes</a><form class="busca" role="search" data-form="nada">${ic('busca')}<label class="sr" for="pr-busca">Buscar paciente</label><input id="pr-busca" class="entrada" type="search" placeholder="Buscar paciente" autocomplete="off"></form><nav id="pr-pacientes" style="margin-top:12px" aria-label="Lista de pacientes"></nav></aside><div class="pr-ficha" id="pr-conteudo" tabindex="-1"></div></div>`;
    $('#pr-busca').value = buscaPac;
    $('#pr-busca').addEventListener('input', (e) => { buscaPac = e.target.value; $('#pr-pacientes').innerHTML = listaPacientesHTML(); });
  }
  $('#pr').classList.toggle('com-paciente', !!p);
  $('#pr-voltar').hidden = !p;
  $('#pr-pacientes').innerHTML = listaPacientesHTML();
  const t = p ? `Prontuário · ${p.nome}` : 'Prontuário eletrônico';
  $('#adm-titulo').textContent = t; document.title = `${t} — Dra. Mayze`;
  $('#pr-conteudo').innerHTML = p ? fichaHTML(p, r.aba) : inicioHTML();
  if (p && TELAS[r.aba].depois) TELAS[r.aba].depois(p);
  if (mudou && !manter) { window.scrollTo(0, 0); } else window.scrollTo(0, y);
}
const rerender = () => renderizar(true);
FORMS.nada = () => {};

function inicioHTML() {

  return `<div class="pilha">
    ${bloco('Alergias', 'alergias', p.alergias, (a) => `<span class="ic-redondo" style="background:var(--grafite);color:var(--creme)">${ic('alerta')}</span><div class="linha-corpo"><b>${esc(a.agente)}</b><small>${esc(a.reacao || 'Reação não descrita')} · gravidade ${esc(a.gravidade).toLowerCase()}</small></div>`, 'Nova alergia')}
    ${bloco('Antecedentes', 'antecedentes', p.antecedentes, (a) => `<span class="ic-redondo">${ic('linhaTempo')}</span><div class="linha-corpo"><b>${esc(a.descricao)}</b><small>${esc(a.tipo)}</small></div>`, 'Novo antecedente')}
    ${bloco('Condições registradas', 'condicoes', p.condicoes, (c) => `<span class="ic-redondo">${ic('prancheta')}</span><div class="linha-corpo"><b>${esc(c.descricao)}</b><small>${esc(c.status)}</small></div>`, 'Nova condição')}
  </div>`;
} };
const DEF_ITEM = {
  alergias: { titulo: 'alergia', campos: [['agente', 'Agente (substância, alimento ou medicamento)', 'text'], ['reacao', 'Reação observada', 'text'], ['gravidade', 'Gravidade', ['Leve', 'Moderada', 'Grave', 'Não informada']]], obrig: ['agente'] },
  antecedentes: { titulo: 'antecedente', campos: [['tipo', 'Tipo', ['Gestacional', 'Neonatal', 'Pessoal', 'Cirúrgico', 'Familiar', 'Outro']], ['descricao', 'Descrição', 'text']], obrig: ['descricao'] },
  condicoes: { titulo: 'condição', campos: [['descricao', 'Descrição', 'text'], ['status', 'Situação', ['Em acompanhamento', 'Resolvida', 'Em investigação']]], obrig: ['descricao'] }
};
ACOES['item-clinico'] = (el) => {
  const p = pacAtual(); const tipo = el.dataset.tipo; const def = DEF_ITEM[tipo]; const it = el.dataset.id ? p[tipo].find((x) => x.id === el.dataset.id) : null;
  const m = abrirModal({ titulo: `${it ? 'Editar' : 'Nova'} ${def.titulo}`, corpo: `<form id="f-it" class="pilha" novalidate>${def.campos.map(([k, r, t]) => `<div class="campo"><label for="it-${k}">${r}</label>${Array.isArray(t) ? `<select id="it-${k}" name="${k}">${t.map((o) => `<option ${it && it[k] === o ? 'selected' : ''}>${o}</option>`).join('')}</select>` : `<input id="it-${k}" name="${k}" value="${esc(it ? it[k] || '' : '')}">`}</div>`).join('')}</form>`, rodape: `<button class="btn btn--sec" data-fechar>Cancelar</button><button class="btn" id="it-ok">Salvar</button>` });
  m.el.querySelector('#it-ok').onclick = () => {
    const f = m.el.querySelector('#f-it'); const regras = {}; def.obrig.forEach((k) => (regras[k] = obrig('este campo')));
    if (tipo === 'alergias') regras.agente = (v) => (!v.trim() ? 'Informe o agente.' : p.alergias.some((a) => a !== it && normalizar(a.agente) === normalizar(v)) ? 'Esta alergia já está registrada.' : '');
    if (!validar(f, regras)) return;
    const d = Object.fromEntries(def.campos.map(([k]) => [k, f[k].value.trim()]));
    if (it) Object.assign(it, d); else p[tipo].push({ id: uid(tipo.slice(0, 2)), ...d, registradoEm: isoDia() });
    salvarBase(`${def.titulo[0].toUpperCase() + def.titulo.slice(1)} ${it ? 'editada' : 'registrada'}: ${p.nome}`); m.fechar(); rerender(); toast('Registro salvo.');
  };
};
ACOES['excluir-item-clinico'] = async (el) => { const p = pacAtual(); const tipo = el.dataset.tipo; const it = p[tipo].find((x) => x.id === el.dataset.id); if (!(await confirmar({ titulo: `Excluir ${DEF_ITEM[tipo].titulo}`, texto: `Excluir “${esc(it.agente || it.descricao)}” do prontuário de ${esc(p.nome)}?`, ok: 'Excluir', perigo: true }))) return; p[tipo] = p[tipo].filter((x) => x !== it); salvarBase(`Registro excluído (${DEF_ITEM[tipo].titulo}): ${p.nome}`); rerender(); toast('Registro excluído.'); };

/* Registros que a família fez no portal (mesmo navegador): introdução alimentar, dúvidas e avaliação */
function cartaoRegistrosFamilia(p) {
  const fam = Armazem.ler('portal.' + p.familia, null) || {};
  const reg = (fam.alimentacao || {})[p.id] || {};
  const cat = [...(Estado.conteudo.alimentos || ALIMENTOS_PADRAO), ...((fam.alimentosExtras || {})[p.id] || [])];
  const nome = (id) => (cat.find((a) => a.id === id) || { nome: id }).nome;
  const itens = Object.entries(reg).filter(([, r]) => r.ofertas && r.ofertas.length);
  const reacoes = itens.filter(([, r]) => r.ofertas.some((o) => o.aceitacao === 'reacao'));
  const duv = (fam.duvidas || []).filter((d) => d.criancaId === p.id && !d.resolvida);
  const avs = (Estado.base.avaliacoes || []).filter((a) => a.pacienteId === p.id);
  return `<section class="cartao">${cab('Registros da família no portal')}
    <dl class="dl-ficha"><dt>Introdução alimentar</dt><dd>${itens.length ? plural(itens.length, 'alimento registrado', 'alimentos registrados') : 'Sem registros'}</dd>
    ${reacoes.length ? `<dt>Marcados com reação</dt><dd>${reacoes.map(([id, r]) => { const o = r.ofertas.filter((x) => x.aceitacao === 'reacao').pop(); return `${esc(nome(id))} (${fmtData(o.data)}${o.nota ? ': ' + esc(o.nota) : ''})`; }).join('; ')}</dd>` : ''}
    <dt>Dúvidas abertas</dt><dd>${duv.length ? duv.map((d) => esc(d.texto)).join('<br>') : 'Nenhuma'}</dd>
    ${avs.length ? `<dt>Avaliação do atendimento</dt><dd>${avs.map((a) => esc(SATISFACAO[a.nota - 1].rotulo)).join(', ')}</dd>` : ''}</dl>
    <p class="mini mudo" style="margin:10px 0 0">Informações registradas pela família, sem conferência clínica. Aparecem quando o portal foi usado neste mesmo navegador.</p></section>`;
}

return { ativo, temAcao: (n) => !!ACOES[n], temForm: (n) => !!FORMS[n], renderizar, ABAS };
})();

iniciar();

</script>
